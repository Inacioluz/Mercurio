spring:
  application:
    name: payment-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercurio_payments}
    username: ${DB_USERNAME:mercurio}
    password: ${DB_PASSWORD:mercurio}
    hikari:
      pool-name: payment-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Espera o ack de todas as replicas e reordena nada: sem isso, um retry
      # poderia inverter a ordem de dois eventos do mesmo pagamento.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: payment-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # O offset avanca so depois que o listener retorna sem erro.
      enable-auto-commit: false
      properties:
        # Default e 5 min. Com 30s, um topico que ganhe particoes e percebido
        # rapido e o grupo rebalanceia, em vez de deixa-las sem consumidor.
        metadata.max.age.ms: 30000
    listener:
      ack-mode: record

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8081}
  error:
    include-stacktrace: never

mercurio:
  outbox:
    # Intervalo do relay. Menor = menos latencia, mais consultas ao banco.
    poll-interval: ${OUTBOX_POLL_INTERVAL:500}
    cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 0 * * * *}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.inacio.mercurio: ${LOG_LEVEL:INFO}
    org.apache.kafka: WARN
